<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anuprasad H A — Data Science & AI Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a0e;
    --surface: #0a1520;
    --surface2: #0f1f30;
    --accent: #00d4ff;
    --accent2: #00ff9d;
    --accent3: #ff6b35;
    --text: #e8f4f8;
    --muted: #6b8fa8;
    --border: rgba(0, 212, 255, 0.15);
    --glow: 0 0 20px rgba(0, 212, 255, 0.3);
    --glow2: 0 0 20px rgba(0, 255, 157, 0.3);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow-x: hidden;
    cursor: none;
  }

  /* Custom cursor */
  .cursor {
    width: 12px; height: 12px;
    background: var(--accent);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s, background 0.2s;
    box-shadow: 0 0 15px var(--accent);
  }
  .cursor-ring {
    width: 36px; height: 36px;
    border: 1px solid rgba(0, 212, 255, 0.5);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none; z-index: 9998;
    transform: translate(-50%, -50%);
    transition: transform 0.15s ease-out;
  }

  /* Canvas background */
  #bg-canvas {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0; opacity: 0.4;
  }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; opacity: 0.3;
  }

  main { position: relative; z-index: 2; }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 20px 60px;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(to bottom, rgba(5,10,14,0.95), transparent);
    backdrop-filter: blur(10px);
  }
  .nav-logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800; font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .nav-logo span { color: var(--accent2); }
  .nav-links { display: flex; gap: 40px; list-style: none; }
  .nav-links a {
    color: var(--muted); text-decoration: none;
    font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase;
    transition: color 0.3s;
    position: relative;
  }
  .nav-links a::after {
    content: ''; position: absolute; bottom: -4px; left: 0;
    width: 0; height: 1px; background: var(--accent);
    transition: width 0.3s;
  }
  .nav-links a:hover { color: var(--accent); }
  .nav-links a:hover::after { width: 100%; }

  /* HERO */
  .hero {
    min-height: 100vh;
    display: flex; align-items: center;
    padding: 120px 60px 80px;
    position: relative;
  }
  .hero-content { max-width: 700px; }

  .hero-tag {
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(0, 212, 255, 0.08);
    border: 1px solid var(--border);
    padding: 8px 18px; border-radius: 2px;
    font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 32px;
    animation: fadeUp 0.8s ease forwards;
  }
  .hero-tag::before {
    content: ''; width: 6px; height: 6px;
    background: var(--accent2); border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(0,255,157,0.5); }
    50% { opacity: 0.7; box-shadow: 0 0 0 8px rgba(0,255,157,0); }
  }

  .hero-name {
    font-family: 'Syne', sans-serif;
    font-size: clamp(3rem, 7vw, 6.5rem);
    font-weight: 800;
    line-height: 0.95;
    margin-bottom: 24px;
    animation: fadeUp 0.8s 0.1s ease both;
  }
  .hero-name .line1 { display: block; color: var(--text); }
  .hero-name .line2 {
    display: block;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .hero-role {
    font-size: 0.85rem; letter-spacing: 0.08em;
    color: var(--muted); margin-bottom: 28px;
    animation: fadeUp 0.8s 0.2s ease both;
  }
  .hero-role span { color: var(--accent3); }

  .hero-desc {
    font-size: 0.88rem; line-height: 1.9;
    color: rgba(232, 244, 248, 0.7);
    max-width: 520px; margin-bottom: 48px;
    animation: fadeUp 0.8s 0.3s ease both;
  }

  .hero-cta {
    display: flex; gap: 16px; flex-wrap: wrap;
    animation: fadeUp 0.8s 0.4s ease both;
  }
  .btn-primary {
    padding: 14px 32px;
    background: var(--accent);
    color: var(--bg);
    font-family: 'Syne', sans-serif;
    font-weight: 700; font-size: 0.8rem;
    letter-spacing: 0.12em; text-transform: uppercase;
    border: none; cursor: pointer;
    text-decoration: none; display: inline-block;
    transition: all 0.3s;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }
  .btn-primary:hover {
    background: var(--accent2);
    box-shadow: var(--glow2);
    transform: translateY(-2px);
  }
  .btn-secondary {
    padding: 14px 32px;
    background: transparent;
    color: var(--accent);
    font-family: 'Syne', sans-serif;
    font-weight: 600; font-size: 0.8rem;
    letter-spacing: 0.12em; text-transform: uppercase;
    border: 1px solid var(--border);
    cursor: pointer; text-decoration: none; display: inline-block;
    transition: all 0.3s;
  }
  .btn-secondary:hover {
    border-color: var(--accent);
    box-shadow: var(--glow);
    background: rgba(0, 212, 255, 0.05);
  }

  .hero-stats {
    position: absolute; right: 60px; bottom: 80px;
    display: flex; flex-direction: column; gap: 32px;
    animation: fadeLeft 0.8s 0.5s ease both;
  }
  .stat { text-align: right; }
  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 2.2rem; font-weight: 800;
    color: var(--accent);
    line-height: 1;
  }
  .stat-num span { font-size: 1rem; color: var(--accent2); }
  .stat-label { font-size: 0.65rem; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; margin-top: 4px; }

  .scroll-hint {
    position: absolute; bottom: 40px; left: 60px;
    display: flex; align-items: center; gap: 12px;
    color: var(--muted); font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
    animation: fadeUp 1s 1s ease both;
  }
  .scroll-line {
    width: 40px; height: 1px; background: var(--muted);
    position: relative; overflow: hidden;
  }
  .scroll-line::after {
    content: ''; position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%; background: var(--accent);
    animation: scanLine 2s infinite;
  }
  @keyframes scanLine { to { left: 100%; } }

  /* SECTIONS common */
  section { padding: 100px 60px; position: relative; }
  .section-header { margin-bottom: 64px; }
  .section-tag {
    font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase;
    color: var(--accent2); margin-bottom: 12px;
  }
  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 800;
    line-height: 1.1;
  }
  .section-title em {
    font-style: normal;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  /* Divider */
  .divider {
    width: 100%; height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 0 60px; width: calc(100% - 120px);
  }

  /* SKILLS */
  .skills-section { background: var(--surface); }
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2px;
  }
  .skill-card {
    background: var(--bg);
    padding: 36px 32px;
    border: 1px solid var(--border);
    position: relative; overflow: hidden;
    transition: all 0.4s;
    opacity: 0; transform: translateY(20px);
    animation: fadeUp 0.6s ease forwards;
  }
  .skill-card:nth-child(1) { animation-delay: 0.1s; }
  .skill-card:nth-child(2) { animation-delay: 0.2s; }
  .skill-card:nth-child(3) { animation-delay: 0.3s; }
  .skill-card:nth-child(4) { animation-delay: 0.4s; }
  .skill-card:nth-child(5) { animation-delay: 0.5s; }

  .skill-card::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.4s;
  }
  .skill-card:hover { background: var(--surface2); border-color: rgba(0,212,255,0.4); transform: translateY(-4px); box-shadow: var(--glow); }
  .skill-card:hover::before { transform: scaleX(1); }

  .skill-icon {
    font-size: 1.8rem; margin-bottom: 20px;
    display: block;
  }
  .skill-cat {
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem;
    color: var(--text); margin-bottom: 16px;
    letter-spacing: 0.04em;
  }
  .skill-tags {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .skill-tag {
    padding: 5px 12px;
    background: rgba(0, 212, 255, 0.06);
    border: 1px solid rgba(0, 212, 255, 0.2);
    font-size: 0.68rem; color: var(--accent);
    letter-spacing: 0.08em;
    transition: all 0.2s;
  }
  .skill-tag:hover { background: rgba(0, 212, 255, 0.15); }
  .skill-tag.green {
    background: rgba(0, 255, 157, 0.06);
    border-color: rgba(0, 255, 157, 0.2);
    color: var(--accent2);
  }
  .skill-tag.green:hover { background: rgba(0, 255, 157, 0.15); }
  .skill-tag.orange {
    background: rgba(255, 107, 53, 0.06);
    border-color: rgba(255, 107, 53, 0.2);
    color: var(--accent3);
  }

  /* EXPERIENCE */
  .exp-section {}
  .timeline { position: relative; padding-left: 40px; }
  .timeline::before {
    content: ''; position: absolute;
    left: 0; top: 0; bottom: 0; width: 1px;
    background: linear-gradient(to bottom, var(--accent), var(--accent2), transparent);
  }
  .exp-item {
    margin-bottom: 56px; position: relative;
    opacity: 0; transform: translateX(-20px);
    animation: fadeRight 0.6s ease forwards;
  }
  .exp-item:nth-child(1) { animation-delay: 0.1s; }
  .exp-item:nth-child(2) { animation-delay: 0.3s; }
  .exp-item::before {
    content: ''; position: absolute;
    left: -46px; top: 6px;
    width: 12px; height: 12px;
    background: var(--accent); border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(0,212,255,0.15);
  }
  .exp-item:nth-child(2)::before { background: var(--accent2); box-shadow: 0 0 0 4px rgba(0,255,157,0.15); }
  .exp-meta {
    display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap; margin-bottom: 8px;
  }
  .exp-title {
    font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700;
    color: var(--text);
  }
  .exp-badge {
    padding: 3px 10px;
    background: rgba(0,212,255,0.1); border: 1px solid rgba(0,212,255,0.3);
    font-size: 0.65rem; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .exp-badge.intern {
    background: rgba(0,255,157,0.1); border-color: rgba(0,255,157,0.3); color: var(--accent2);
  }
  .exp-company { color: var(--accent); font-size: 0.82rem; margin-bottom: 4px; }
  .exp-period { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.1em; margin-bottom: 20px; }
  .exp-bullets { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .exp-bullets li {
    font-size: 0.82rem; line-height: 1.8;
    color: rgba(232,244,248,0.75);
    padding-left: 20px; position: relative;
  }
  .exp-bullets li::before {
    content: '▹'; position: absolute; left: 0;
    color: var(--accent); font-size: 0.7rem; top: 1px;
  }

  /* PROJECTS */
  .projects-section { background: var(--surface); }
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 2px;
  }
  .project-card {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 36px 32px;
    position: relative; overflow: hidden;
    transition: all 0.4s;
    display: flex; flex-direction: column;
  }
  .project-card::after {
    content: ''; position: absolute;
    bottom: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.4s;
  }
  .project-card:hover { border-color: rgba(0,212,255,0.4); transform: translateY(-4px); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .project-card:hover::after { transform: scaleX(1); }
  .project-num {
    font-family: 'Syne', sans-serif; font-size: 3rem; font-weight: 800;
    color: rgba(0,212,255,0.08); line-height: 1; margin-bottom: 20px;
    transition: color 0.3s;
  }
  .project-card:hover .project-num { color: rgba(0,212,255,0.18); }
  .project-name {
    font-family: 'Syne', sans-serif; font-size: 1.05rem; font-weight: 700;
    color: var(--text); margin-bottom: 16px; line-height: 1.3;
  }
  .project-desc {
    font-size: 0.8rem; line-height: 1.9;
    color: rgba(232,244,248,0.65);
    margin-bottom: 24px; flex: 1;
  }
  .project-tech {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto;
  }
  .tech-pill {
    padding: 4px 10px;
    background: rgba(0,255,157,0.06); border: 1px solid rgba(0,255,157,0.2);
    font-size: 0.62rem; color: var(--accent2); letter-spacing: 0.06em;
  }
  .project-star {
    position: absolute; top: 24px; right: 24px;
    font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em;
  }

  /* EDUCATION */
  .edu-section {}
  .edu-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 2px;
  }
  .edu-card {
    border: 1px solid var(--border);
    padding: 32px 28px;
    position: relative; overflow: hidden;
    transition: all 0.3s;
  }
  .edu-card:hover { border-color: rgba(0,212,255,0.4); background: var(--surface2); }
  .edu-year { font-size: 0.65rem; letter-spacing: 0.2em; color: var(--accent3); text-transform: uppercase; margin-bottom: 12px; }
  .edu-degree { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
  .edu-institute { font-size: 0.78rem; color: var(--accent); margin-bottom: 12px; }
  .edu-score {
    display: inline-block;
    padding: 5px 14px;
    background: rgba(0,255,157,0.08); border: 1px solid rgba(0,255,157,0.25);
    font-size: 0.72rem; color: var(--accent2); letter-spacing: 0.08em;
  }

  /* ABOUT/CONTACT */
  .contact-section {
    background: var(--surface);
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 80px; align-items: center;
  }
  .contact-left {}
  .contact-intro {
    font-size: 0.88rem; line-height: 1.9;
    color: rgba(232,244,248,0.7); margin-bottom: 40px;
  }
  .contact-links { display: flex; flex-direction: column; gap: 16px; }
  .contact-link {
    display: flex; align-items: center; gap: 16px;
    text-decoration: none; color: var(--text);
    font-size: 0.82rem; padding: 16px 20px;
    border: 1px solid var(--border);
    transition: all 0.3s;
  }
  .contact-link:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.05); transform: translateX(8px); }
  .contact-link-icon { font-size: 1rem; width: 24px; text-align: center; }
  .contact-right { text-align: center; }
  .avatar-ring {
    width: 240px; height: 240px; margin: 0 auto 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    padding: 3px;
    position: relative;
    animation: spinSlow 8s linear infinite;
  }
  @keyframes spinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .avatar-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    animation: spinSlow 8s linear infinite reverse;
  }
  .avatar-initials {
    font-family: 'Syne', sans-serif; font-size: 3.5rem; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .contact-name {
    font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800;
    margin-bottom: 8px;
  }
  .contact-tagline { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.1em; }

  /* FOOTER */
  footer {
    padding: 32px 60px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--border);
    font-size: 0.68rem; color: var(--muted); letter-spacing: 0.1em;
  }
  footer span { color: var(--accent); }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeLeft {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes fadeRight {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* INTERSECTION OBSERVER animations */
  .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  /* Responsive */
  @media (max-width: 900px) {
    nav { padding: 16px 24px; }
    .nav-links { display: none; }
    section { padding: 80px 24px; }
    .hero { padding: 120px 24px 80px; }
    .hero-stats { display: none; }
    footer { padding: 24px; flex-direction: column; gap: 8px; text-align: center; }
    .contact-section { grid-template-columns: 1fr; }
    .divider { margin: 0 24px; width: calc(100% - 48px); }
    .scroll-hint { left: 24px; }
  }

  /* Glitch effect on name */
  .glitch {
    position: relative;
  }
  .glitch::before, .glitch::after {
    content: attr(data-text);
    position: absolute; top: 0; left: 0; width: 100%;
    font-family: 'Syne', sans-serif; font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .glitch::before {
    animation: glitch1 4s infinite;
    clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
    transform: translate(-2px, -2px);
  }
  .glitch::after {
    animation: glitch2 4s infinite;
    clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
    transform: translate(2px, 2px);
  }
  @keyframes glitch1 {
    0%, 90%, 100% { transform: translate(-2px, -2px); opacity: 0; }
    92%, 94% { transform: translate(-4px, 2px); opacity: 0.8; }
    96% { transform: translate(2px, -2px); opacity: 0; }
  }
  @keyframes glitch2 {
    0%, 90%, 100% { transform: translate(2px, 2px); opacity: 0; }
    92%, 94% { transform: translate(4px, -2px); opacity: 0.8; }
    96% { transform: translate(-2px, 2px); opacity: 0; }
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursor-ring"></div>

<canvas id="bg-canvas"></canvas>

<main>
  <!-- NAV -->
  <nav>
    <div class="nav-logo">AP<span>.</span>HA</div>
    <ul class="nav-links">
      <li><a href="#skills">Skills</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#education">Education</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section class="hero" id="home">
    <div class="hero-content">
      <div class="hero-tag">Available for opportunities</div>
